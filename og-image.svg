<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4AE3A0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4AE3A0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4AE3A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0B"/>
  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Glow center -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Jar icon -->
  <g transform="translate(120, 185)">
    <path d="M10 60 L18 152 L102 152 L110 60Z" stroke="#4AE3A0" stroke-width="5" stroke-linejoin="round" fill="none"/>
    <path d="M4 60 L116 60" stroke="#4AE3A0" stroke-width="5" stroke-linecap="round"/>
    <path d="M38 60 L33 28 L87 28 L82 60" stroke="#4AE3A0" stroke-width="4" stroke-linejoin="round" fill="none"/>
    <circle cx="48" cy="95" r="7" fill="#4AE3A0" opacity="0.85"/>
    <circle cx="68" cy="118" r="7" fill="#4AE3A0" opacity="0.85"/>
    <circle cx="82" cy="86" r="5" fill="#4AE3A0" opacity="0.5"/>
    <!-- Heatmap dots -->
    <circle cx="48" cy="95" r="18" fill="url(#dotglow)"/>
    <circle cx="68" cy="118" r="18" fill="url(#dotglow)"/>
  </g>

  <!-- PoorJar wordmark -->
  <text x="280" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="700" fill="#ffffff" letter-spacing="-3">PoorJar</text>

  <!-- Tagline -->
  <text x="280" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#4AE3A0">Clarity, but your data stays yours.</text>

  <!-- Bottom bar -->
  <rect x="0" y="540" width="1200" height="90" fill="#111111"/>
  <rect x="0" y="540" width="1200" height="1" fill="#1e1e20"/>

  <!-- Badges -->
  <rect x="120" y="566" width="130" height="36" rx="6" fill="#1a1a1c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="185" y="589" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4AE3A0" text-anchor="middle">MIT License</text>

  <rect x="268" y="566" width="130" height="36" rx="6" fill="#1a1a1c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="333" y="589" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4AE3A0" text-anchor="middle">Zero deps</text>

  <rect x="416" y="566" width="130" height="36" rx="6" fill="#1a1a1c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="481" y="589" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4AE3A0" text-anchor="middle">Open source</text>

  <text x="1080" y="589" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#555" text-anchor="middle">poorjar.com</text>
</svg>
